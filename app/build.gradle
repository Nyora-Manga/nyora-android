// Reads a key from .env.sync (repo root), env var taking precedence. Returns ''
// when absent so BaseApp falls back to its baked default.
String supabaseEnv(String key) {
	def fromEnv = System.getenv(key)
	if (fromEnv) return fromEnv
	def envFile = new File(rootProject.projectDir, '.env.sync')
	if (envFile.exists()) {
		for (String line : envFile.readLines()) {
			def t = line.trim()
			if (!t || t.startsWith('#')) continue
			def i = t.indexOf('=')
			if (i > 0 && t.substring(0, i).trim() == key) return t.substring(i + 1).trim()
		}
	}
	return ''
}

android {
	compileSdk = 36
	namespace = 'com.nyora.hasan72341'

