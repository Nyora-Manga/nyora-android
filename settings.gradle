pluginManagement {
	includeBuild("build-logic")
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		maven {
			url 'https://jitpack.io'
		}
	}
}

// Scraper-stripped fork of kotatsu-parsers-redo (Play compliance): all site parsers removed, the
// MangaParserSource enum reduced to a single @Broken STUB. Substitutes the published
// com.github.Nyora-Manga:kotatsu-parsers-stripped when checked out locally; CI/release use JitPack.
if (file('../../kotatsu-parsers-stripped').exists()) {
	includeBuild('../../kotatsu-parsers-stripped')
}

include ':app'
include ':engine'
include ':translator'
rootProject.name = "Nyora"
