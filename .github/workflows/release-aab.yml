name: Build Signed AAB

# Manually-triggered signed Android App Bundle for Play Store upload. Signed with the SAME
# release keystore as the APK releases (secrets.KEYSTORE_FILE + passwords). Download the .aab
# from the run's artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check out the data-driven sources
        run: .github/scripts/init-data-submodule.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx2g"'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.workers.max=2'
          } >> ~/.gradle/gradle.properties

      - name: Read version from build.gradle
        id: version
        run: |
          VER=$(grep -oP "versionName project.hasProperty\\('versionName'\\) \\? project.property\\('versionName'\\) : '\\K[^']+" app/build.gradle | head -n1)
          CODE=$(grep -oP "versionCode project.hasProperty\\('versionCode'\\) \\? project.property\\('versionCode'\\).toInteger\\(\\) : \\K[0-9]+" app/build.gradle | head -n1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "version_code=$CODE" >> $GITHUB_OUTPUT
          echo "Building AAB $VER ($CODE)"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build signed AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          ./gradlew :app:bundleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --no-build-cache --no-configuration-cache

      - name: Verify AAB signature
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          "$JAVA_HOME/bin/jarsigner" -verify -certs -verbose:summary "$AAB" 2>&1 | head -20

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyora-release-aab-${{ steps.version.outputs.version }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
