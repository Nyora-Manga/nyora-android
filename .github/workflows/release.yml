name: Release Build

# Publishes a GitHub Release with the signed APK when a v* tag is
# pushed. The tag must agree with app/build.gradle or check_version fails.
#
# versionCode is MAJOR*10000 + MINOR*1000 + PATCH*100, matching every release
# so far (1.0 -> 10000, 2.6 -> 26000, 2.7.1 -> 27100, 10.0 -> 100000). This
# means MINOR and PATCH must each stay below 10, or they carry into the digit
# above and collide with the next version up.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check_version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "Tag version: $VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH * 100))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Read build.gradle defaults
        run: |
          FILE=app/build.gradle
          if [ ! -f "$FILE" ]; then echo "Missing $FILE" && exit 1; fi
          GRADLE_VER=$(grep -oP "versionName project.hasProperty\\('versionName'\\) \\? project.property\\('versionName'\\) : '\\K[^']+" "$FILE" | head -n1 || true)
          GRADLE_CODE=$(grep -oP "versionCode project.hasProperty\\('versionCode'\\) \\? project.property\\('versionCode'\\).toInteger\\(\\) : \\K[0-9]+" "$FILE" | head -n1 || true)
          echo "gradle_version=$GRADLE_VER" >> $GITHUB_OUTPUT
          echo "gradle_version_code=$GRADLE_CODE" >> $GITHUB_OUTPUT
          echo "build.gradle defaults: $GRADLE_VER ($GRADLE_CODE)"

      - name: Compare tag with files
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=${PATCH:-0}
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH * 100))

          GRADLE_VER=$(grep -oP "versionName project.hasProperty\\('versionName'\\) \\? project.property\\('versionName'\\) : '\\K[^']+" app/build.gradle | head -n1 || true)
          GRADLE_CODE=$(grep -oP "versionCode project.hasProperty\\('versionCode'\\) \\? project.property\\('versionCode'\\).toInteger\\(\\) : \\K[0-9]+" app/build.gradle | head -n1 || true)

          echo "Tag: $VERSION ($EXPECTED_CODE)"
          echo "build.gradle: $GRADLE_VER ($GRADLE_CODE)"

          if [ "$GRADLE_VER" != "$VERSION" ]; then echo "ERROR: app/build.gradle default versionName ($GRADLE_VER) does not match tag ($VERSION)" && exit 1; fi
          if [ "$GRADLE_CODE" != "$EXPECTED_CODE" ]; then echo "ERROR: app/build.gradle default versionCode ($GRADLE_CODE) does not match expected ($EXPECTED_CODE)" && exit 1; fi
          echo "Version check passed."

  build:
    needs: check_version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check out the data-driven sources
        run: .github/scripts/init-data-submodule.sh

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Gradle memory for CI
        # The project gradle.properties asks for 8 GB for BOTH the Gradle daemon
        # and the Kotlin daemon — that's tuned for the dev machine and gets the
        # build OOM-killed on a hosted runner. A gradle.properties in
        # GRADLE_USER_HOME (~/.gradle) overrides the project file, so cap the
        # daemons here and serialize work so R8 and Kotlin don't both peak at once.
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx2g"'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.workers.max=2'
          } >> ~/.gradle/gradle.properties

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Extract major.minor.patch and calculate version code
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION" 
          PATCH=${PATCH:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 1000 + PATCH * 100))
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Supabase/Google sync config — build.gradle's supabaseEnv() reads these
          # env vars first (taking precedence over the now-untracked .env.sync;
          # falls back to the baked prod defaults in BaseApp.kt if unset).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            --no-build-cache --no-configuration-cache

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nyora ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
